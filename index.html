<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 520px;
      width: 90%;
      z-index: 2;
    }

    /* Botón inicial */
    .btn-open {
      background: linear-gradient(135deg, #ffd000, #ff9100);
      color: #1a1a1a;
      border: none;
      padding: 14px 34px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 208, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-open:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(255, 208, 0, 0.6);
    }

    /* Contenedor del contenido */
    .gift-content {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .gift-content.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* === CONTENEDOR DEL RAMO === */
    .bouquet-wrapper {
      position: relative;
      width: 280px;
      height: 260px;
      margin: 0 auto 1.5rem auto;
      animation: gentle-sway 4s ease-in-out infinite alternate;
    }

    /* Cada flor con su propio tallo y posición */
    .flower-item {
      position: absolute;
      transform-origin: bottom center;
    }

    /* Flor central */
    .flower-center {
      top: 0px;
      left: calc(50% - 45px);
      z-index: 3;
    }

    /* Flor izquierda */
    .flower-left {
      top: 30px;
      left: calc(50% - 105px);
      transform: rotate(-18deg) scale(0.9);
      z-index: 2;
    }

    /* Flor derecha */
    .flower-right {
      top: 30px;
      left: calc(50% + 15px);
      transform: rotate(18deg) scale(0.9);
      z-index: 2;
    }

    /* Cabeza de la flor */
    .flower-head {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      background: radial-gradient(circle, #5a3818 0%, #291202 100%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.7);
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 44px;
      background: linear-gradient(to top, #ffb703, #ffe600);
      border-radius: 50% 50% 20% 20%;
      transform-origin: bottom center;
      margin-left: -7.5px;
      margin-top: -44px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    /* Tallos individuales */
    .stem {
      width: 7px;
      background: linear-gradient(to right, #2d6a4f, #40916c);
      border-radius: 4px;
      margin: -6px auto 0 auto;
      position: relative;
    }

    .flower-center .stem {
      height: 145px;
    }

    .flower-left .stem {
      height: 135px;
      transform: rotate(7deg);
    }

    .flower-right .stem {
      height: 135px;
      transform: rotate(-7deg);
    }

    /* Hojas decorativas */
    .leaf {
      position: absolute;
      width: 28px;
      height: 16px;
      background: #40916c;
      border-radius: 100px 0;
      z-index: 1;
    }

    .leaf-1 {
      top: 140px;
      left: 35px;
      transform: rotate(-40deg);
    }

    .leaf-2 {
      top: 140px;
      right: 35px;
      transform: rotate(220deg);
    }

    /* Cinta / Lazo del ramo */
    .bouquet-ribbon {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ribbon-knot {
      width: 24px;
      height: 14px;
      background: #e63946;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .ribbon-tails {
      display: flex;
      gap: 4px;
      margin-top: -2px;
    }

    .ribbon-tail {
      width: 6px;
      height: 22px;
      background: #e63946;
      border-radius: 2px;
    }

    .ribbon-tail.left {
      transform: rotate(18deg);
    }

    .ribbon-tail.right {
      transform: rotate(-18deg);
    }

    /* Tarjeta de texto */
    .card-text {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 1.8rem;
      margin-top: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .card-text h1 {
      font-size: 1.6rem;
      color: #ffd000;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .card-text p {
      font-size: 1.05rem;
      line-height: 1.65;
      color: #e2e8f0;
    }

    /* Animaciones */
    @keyframes gentle-sway {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2.5deg); }
    }

    .petal-particle {
      position: fixed;
      top: -10px;
      background: #ffe169;
      border-radius: 100% 0% 100% 0%;
      pointer-events: none;
      animation: fall linear forwards;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Botón inicial -->
    <div id="intro-screen">
      <button class="btn-open" onclick="revealGift()">Abrir sorpresa ✨</button>
    </div>

    <!-- Ramo y mensaje -->
    <div id="gift-content" class="gift-content">
      <div class="bouquet-wrapper">
        <!-- Flor Izquierda -->
        <div class="flower-item flower-left">
          <div class="flower-head">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"></div>
        </div>

        <!-- Flor Central -->
        <div class="flower-item flower-center">
          <div class="flower-head">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"></div>
        </div>

        <!-- Flor Derecha -->
        <div class="flower-item flower-right">
          <div class="flower-head">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"></div>
        </div>

        <!-- Hojas y Lazo que une el ramo -->
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="bouquet-ribbon">
          <div class="ribbon-knot"></div>
          <div class="ribbon-tails">
            <div class="ribbon-tail left"></div>
            <div class="ribbon-tail right"></div>
          </div>
        </div>
      </div>

      <div class="card-text">
        <h1>Para ti 🌻</h1>
        <p>
          Un ramito de flores amarillas que nunca se marchitan, hechas con código especialmente para ti. 
          Gracias por iluminar mis días.
        </p>
      </div>
    </div>
  </div>

  <script>
    // Genera automáticamente los pétalos para las 3 flores
    const flowerHeads = document.querySelectorAll('.petals');
    const totalPetals = 14;

    flowerHeads.forEach(container => {
      for (let i = 0; i < totalPetals; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.transform = `rotate(${i * (360 / totalPetals)}deg)`;
        container.appendChild(petal);
      }
    });

    // Revelar ramo y activar partículas
    function revealGift() {
      document.getElementById('intro-screen').style.display = 'none';
      const content = document.getElementById('gift-content');
      content.classList.add('show');
      
      setInterval(createFloatingPetal, 260);
    }

    function createFloatingPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal-particle';
      petal.style.left = Math.random() * window.innerWidth + 'px';
      const size = Math.random() * 12 + 10;
      petal.style.width = size + 'px';
      petal.style.height = size + 'px';
      petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
      document.body.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 7000);
    }
  </script>
</body>
</html>
